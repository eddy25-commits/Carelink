# This is a monorepo. The frontend (React/Vite) deploys separately — see
# frontend/vercel.json and the "Deploying" section in README.md. This blueprint only
# provisions the backend API and its database.

databases:
  - name: carelink-db
    plan: starter
    postgresMajorVersion: "16"
    # Render Postgres supports enabling PostGIS (used for outbreak/incident clustering).
    # The app's own first migration runs `CREATE EXTENSION IF NOT EXISTS postgis`, so no
    # manual step is needed here — just confirm your chosen plan supports the extension.

services:
  - type: web
    name: carelink-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    # Runs after each build, before the new version receives traffic — applies any new
    # migrations. (Uses the same tsx-powered `knex` CLI as local/Docker Compose — see
    # backend/Dockerfile, which keeps devDependencies in the runtime image for this reason.)
    preDeployCommand: npm run migrate:latest

    disk:
      name: carelink-uploads
      mountPath: /app/uploads
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carelink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false # set to your deployed frontend URL, e.g. https://carelink.vercel.app
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_ATTACHMENT_SIZE_MB
        value: "5"
      - key: MAX_ATTACHMENTS_PER_REPORT
        value: "3"
      - key: NOTIFICATION_PROVIDER
        value: log
      - key: SLA_MONITOR_CRON
        value: "*/5 * * * *"
      - key: INCIDENT_CLUSTER_CRON
        value: "*/15 * * * *"
      - key: SENTRY_DSN
        sync: false # optional — leave unset to log errors locally only
      - key: METRICS_ENABLED
        value: "false"
