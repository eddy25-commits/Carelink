version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: health-triage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_triage
    ports:
      - "5432:5432"
    volumes:
      - health_triage_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: health-triage-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/health_triage
      JWT_SECRET: dev-only-change-this-secret-in-production
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

volumes:
  health_triage_db_data:
